<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>THAI NEWS - ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Arial,"Noto Sans Thai",sans-serif;
}

.container{
    max-width:1000px;
    margin:40px auto;
    padding:20px;
}

h1{
    color:#ff7a00;
    margin-bottom:5px;
}

.sub{
    color:#999;
    margin-bottom:25px;
}

.panel{
    background:#111;
    border:1px solid #292929;
    border-radius:16px;
    padding:25px;
    margin-bottom:20px;
}

label{
    display:block;
    margin:16px 0 8px;
    color:#ddd;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    background:#080808;
    color:#fff;
    border:1px solid #333;
    border-radius:10px;
    padding:13px;
    font-size:15px;
}

textarea{
    min-height:250px;
    resize:vertical;
}

button{
    border:0;
    border-radius:10px;
    padding:13px 20px;
    cursor:pointer;
    font-weight:bold;
}

.publish{
    width:100%;
    background:#ff7a00;
    color:#fff;
    font-size:16px;
    margin-top:20px;
}

.publish:hover{
    background:#ff8c26;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    display:none;
}

.success{
    display:block;
    background:#123b20;
    color:#75e69a;
}

.error{
    display:block;
    background:#401313;
    color:#ff8d8d;
}

.preview{
    max-width:300px;
    max-height:180px;
    object-fit:cover;
    border-radius:10px;
    margin-top:10px;
    display:none;
}

.content-preview{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.content-preview img{
    width:120px;
    height:80px;
    object-fit:cover;
    border-radius:8px;
}

.news-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid #292929;
}

.news-left{
    display:flex;
    align-items:center;
    gap:14px;
    min-width:0;
}

.news-thumb{
    width:90px;
    height:60px;
    object-fit:cover;
    border-radius:8px;
    background:#222;
    flex-shrink:0;
}

.news-title{
    font-weight:bold;
}

.news-meta{
    color:#888;
    font-size:13px;
    margin-top:5px;
}

.delete{
    background:#7b1616;
    color:white;
    flex-shrink:0;
}

.delete:hover{
    background:#a51e1e;
}

.empty{
    color:#777;
    padding:20px 0;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:20px;
}

.site-btn{
    background:#222;
    color:#fff;
    text-decoration:none;
    padding:10px 15px;
    border-radius:9px;
    font-weight:bold;
}

.site-btn:hover{
    background:#ff7a00;
}

@media(max-width:650px){

    .container{
        margin:15px auto;
        padding:15px;
    }

    .panel{
        padding:18px;
    }

    .news-row{
        align-items:flex-start;
    }

    .news-left{
        align-items:flex-start;
    }

    .news-thumb{
        width:75px;
        height:55px;
    }

    .delete{
        padding:9px 12px;
    }

}

</style>
</head>


<body>


<div class="container">


<div class="top">

    <div>

        <h1>THAI NEWS ADMIN</h1>

        <div class="sub">
            ระบบจัดการข่าวของเจ้าของเว็บไซต์
        </div>

    </div>


    <a
        class="site-btn"
        href="index.html"
        target="_blank"
    >
        ← เว็บไซต์ข่าว
    </a>

</div>



<!-- =========================================
     FORM
========================================= -->

<div class="panel">

<form id="newsForm">


<label>
    หัวข่าว
</label>

<input
    id="title"
    type="text"
    required
    placeholder="ใส่หัวข่าว"
/>



<label>
    หมวดข่าว
</label>

<select id="category">

    <option value="ข่าวล่าสุด">
        ข่าวล่าสุด
    </option>

    <option value="การเมือง">
        การเมือง
    </option>

    <option value="บันเทิง">
        บันเทิง
    </option>

    <option value="อุบัติเหตุ">
        อุบัติเหตุ
    </option>

    <option value="สังคม">
        สังคม
    </option>

    <option value="เศรษฐกิจ">
        เศรษฐกิจ
    </option>

    <option value="กีฬา">
        กีฬา
    </option>

    <option value="ต่างประเทศ">
        ต่างประเทศ
    </option>

    <option value="ข่าวทั่วไป">
        ข่าวทั่วไป
    </option>

</select>



<label>
    คำโปรย
</label>

<input
    id="summary"
    type="text"
    placeholder="คำโปรยใต้หัวข่าว"
/>



<label>
    เนื้อหาข่าว
</label>

<textarea
    id="content"
    required
    placeholder="เขียนเนื้อหาข่าวที่นี่"
></textarea>



<label>
    ภาพปกข่าว
</label>

<input
    id="cover"
    type="file"
    accept="image/*"
    required
>

<img
    id="coverPreview"
    class="preview"
    alt="ตัวอย่างภาพปก"
>



<label>
    ภาพประกอบข่าว
</label>

<input
    id="contentImages"
    type="file"
    accept="image/*"
    multiple
>

<div
    id="contentPreview"
    class="content-preview"
></div>



<button
    class="publish"
    type="submit"
>
    เผยแพร่ข่าว
</button>


<div
    id="status"
    class="status"
></div>


</form>

</div>



<!-- =========================================
     NEWS LIST
========================================= -->

<div class="panel">

<h2>
    ข่าวที่เผยแพร่แล้ว
</h2>

<div id="newsList">
    กำลังโหลด...
</div>

</div>


</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://vkzqqykkuvsbjzhnauxe.supabase.co";


const SUPABASE_KEY =
"sb_publishable_PClUbzNwuPKhvZ0QfHBn6g_Dhkm5Tos";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);



/* =====================================================
   ELEMENT
===================================================== */

const $ =
id =>
document.getElementById(id);


const form =
$("newsForm");


const statusBox =
$("status");



/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text,
    type
){

    statusBox.textContent =
        text;

    statusBox.className =
        "status " + type;

}



/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(
    text
){

    return String(
        text || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}



/* =====================================================
   RESIZE IMAGE
===================================================== */

function resizeImage(
    file,
    maxWidth = 1200,
    maxHeight = 900,
    quality = 0.65
){

    return new Promise(
        (
            resolve,
            reject
        ) => {

            const reader =
                new FileReader();


            reader.onerror =
                () =>
                reject(
                    new Error(
                        "อ่านรูปไม่ได้"
                    )
                );


            reader.onload =
                () => {

                    const img =
                        new Image();


                    img.onerror =
                        () =>
                        reject(
                            new Error(
                                "รูปภาพไม่ถูกต้อง"
                            )
                        );


                    img.onload =
                        () => {

                            let width =
                                img.width;

                            let height =
                                img.height;


                            const ratio =
                                Math.min(
                                    maxWidth / width,
                                    maxHeight / height,
                                    1
                                );


                            width =
                                Math.round(
                                    width * ratio
                                );


                            height =
                                Math.round(
                                    height * ratio
                                );


                            const canvas =
                                document.createElement(
                                    "canvas"
                                );


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const ctx =
                                canvas.getContext(
                                    "2d"
                                );


                            ctx.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            resolve(
                                canvas.toDataURL(
                                    "image/jpeg",
                                    quality
                                )
                            );

                        };


                    img.src =
                        reader.result;

                };


            reader.readAsDataURL(
                file
            );

        }
    );

}



/* =====================================================
   COVER PREVIEW
===================================================== */

$("cover")
.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];


        if(!file){

            $("coverPreview")
                .style.display =
                "none";

            return;

        }


        try{

            const image =
                await resizeImage(
                    file,
                    900,
                    600,
                    0.65
                );


            $("coverPreview")
                .src =
                image;


            $("coverPreview")
                .style.display =
                "block";

        }
        catch(error){

            showStatus(
                error.message,
                "error"
            );

        }

    }
);



/* =====================================================
   CONTENT IMAGE PREVIEW
===================================================== */

$("contentImages")
.addEventListener(
    "change",
    function(){

        const box =
            $("contentPreview");


        box.innerHTML =
            "";


        Array.from(
            this.files
        )
        .slice(
            0,
            10
        )
        .forEach(
            file => {

                const reader =
                    new FileReader();


                const img =
                    document.createElement(
                        "img"
                    );


                reader.onload =
                    event => {

                        img.src =
                            event.target.result;

                    };


                reader.readAsDataURL(
                    file
                );


                box.appendChild(
                    img
                );

            }
        );

    }
);



/* =====================================================
   PUBLISH
===================================================== */

form.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        try{

            showStatus(
                "กำลังย่อภาพและเผยแพร่ข่าว...",
                "success"
            );


            const title =
                $("title")
                .value
                .trim();


            const category =
                $("category")
                .value;


            const summary =
                $("summary")
                .value
                .trim();


            const content =
                $("content")
                .value
                .trim();


            const coverFile =
                $("cover")
                .files[0];


            const contentFiles =
                Array.from(
                    $("contentImages")
                    .files
                )
                .slice(
                    0,
                    10
                );


            if(!title){

                throw new Error(
                    "กรุณาใส่หัวข่าว"
                );

            }


            if(!content){

                throw new Error(
                    "กรุณาใส่เนื้อข่าว"
                );

            }


            if(!coverFile){

                throw new Error(
                    "กรุณาเลือกภาพปกข่าว"
                );

            }



            /* =========================================
               COVER
            ========================================= */

            const coverImage =
                await resizeImage(
                    coverFile,
                    1400,
                    900,
                    0.70
                );



            /* =========================================
               CONTENT IMAGES
            ========================================= */

            const contentImages =
                [];


            for(
                const file
                of contentFiles
            ){

                const image =
                    await resizeImage(
                        file,
                        1200,
                        1000,
                        0.65
                    );


                contentImages.push(
                    image
                );

            }



            /* =========================================
               INSERT
               
               ใช้ชื่อ field ให้ตรงกับ
               public.news_articles
            ========================================= */

            const {
                data,
                error
            } =
            await supabaseClient
            .from(
                "news_articles"
            )
            .insert({

                category:
                    category,

                title:
                    title,

                summary:
                    summary,

                content:
                    content,

                cover_image:
                    coverImage,

                content_images:
                    contentImages,

                published:
                    true

            })
            .select();


            if(error){

                console.error(
                    error
                );

                throw new Error(
                    error.message
                );

            }



            /* =========================================
               SUCCESS
            ========================================= */

            showStatus(
                "เผยแพร่ข่าวสำเร็จ! ข่าวและภาพทั้งหมดถูกบันทึกใน Supabase แล้ว",
                "success"
            );


            form.reset();


            $("coverPreview")
                .src =
                "";


            $("coverPreview")
                .style.display =
                "none";


            $("contentPreview")
                .innerHTML =
                "";


            await loadNews();

        }
        catch(error){

            console.error(
                error
            );


            showStatus(
                "เผยแพร่ไม่สำเร็จ: " +
                error.message,
                "error"
            );

        }

    }
);



/* =====================================================
   LOAD NEWS
===================================================== */

async function loadNews(){

    const box =
        $("newsList");


    box.innerHTML =
        "กำลังโหลดข่าว...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient
        .from(
            "news_articles"
        )
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


        if(error){

            throw error;

        }


        if(
            !data ||
            !data.length
        ){

            box.innerHTML =
                `
                <div class="empty">
                    ยังไม่มีข่าวที่เผยแพร่
                </div>
                `;

            return;

        }


        box.innerHTML =
            "";


        data.forEach(
            item => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "news-row";


                const left =
                    document.createElement(
                        "div"
                    );


                left.className =
                    "news-left";


                const image =
                    document.createElement(
                        "img"
                    );


                image.className =
                    "news-thumb";


                image.src =
                    item.cover_image ||
                    "assets/banner.jpg";


                image.alt =
                    item.title ||
                    "";


                const info =
                    document.createElement(
                        "div"
                    );


                const title =
                    document.createElement(
                        "div"
                    );


                title.className =
                    "news-title";


                title.textContent =
                    item.title ||
                    "ไม่มีหัวข่าว";


                const meta =
                    document.createElement(
                        "div"
                    );


                meta.className =
                    "news-meta";


                meta.textContent =
                    `${
                        item.category ||
                        "ข่าว"
                    } · ${
                        item.created_at
                        ?
                        new Date(
                            item.created_at
                        ).toLocaleString(
                            "th-TH"
                        )
                        :
                        ""
                    }`;


                info.append(
                    title,
                    meta
                );


                left.append(
                    image,
                    info
                );


                const deleteButton =
                    document.createElement(
                        "button"
                    );


                deleteButton.className =
                    "delete";


                deleteButton.textContent =
                    "ลบ";


                deleteButton.onclick =
                    () =>
                    deleteNews(
                        item.id
                    );


                row.append(
                    left,
                    deleteButton
                );


                box.appendChild(
                    row
                );

            }
        );

    }
    catch(error){

        console.error(
            error
        );


        box.innerHTML =
            `
            <div class="empty">

                โหลดข่าวไม่สำเร็จ

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>
            `;

    }

}



/* =====================================================
   DELETE NEWS
===================================================== */

async function deleteNews(
    id
){

    if(
        !confirm(
            "ต้องการลบข่าวนี้ใช่หรือไม่?"
        )
    ){

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
        .from(
            "news_articles"
        )
        .delete()
        .eq(
            "id",
            id
        );


        if(error){

            throw error;

        }


        showStatus(
            "ลบข่าวเรียบร้อยแล้ว",
            "success"
        );


        await loadNews();

    }
    catch(error){

        console.error(
            error
        );


        showStatus(
            "ลบไม่สำเร็จ: " +
            error.message,
            "error"
        );

    }

}



/* =====================================================
   REALTIME
===================================================== */

supabaseClient
.channel(
    "admin-news-live"
)
.on(
    "postgres_changes",
    {
        event:"*",
        schema:"public",
        table:"news_articles"
    },
    function(){

        loadNews();

    }
)
.subscribe();



/* =====================================================
   START
===================================================== */

loadNews();

</script>

</body>
</html>
