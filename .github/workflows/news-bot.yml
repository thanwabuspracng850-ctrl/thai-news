name: THAI NEWS - 3 Hour News Bot

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: thai-news-bot
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run news bot
        run: python news_bot.py

      - name: Commit central database
        run: |
          git config user.name "THAI NEWS BOT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No news database changes."
          else
            git commit -m "chore: update central news database"
            git push
          fi
